name: Cross-platform cleanup tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run fixture tests (no real home data)
        run: python -m unittest discover -s tests -v
      - name: Verify native CLI help
        run: python scripts/local_cleanup.py audit --help
      - name: Verify downloadable package entrypoint
        run: |
          python -c "import tempfile, pathlib, zipfile, subprocess, sys; p=pathlib.Path(tempfile.mkdtemp()); zipfile.ZipFile('dist/claude-post-ban-cleanup.zip').extractall(p); subprocess.check_call([sys.executable,str(p/'claude-post-ban-cleanup/scripts/local_cleanup.py'),'audit','--help'])"
